# LearnAble is a fully client-side app (data lives in localStorage), so
# Netlify serves the learnable/ folder as a static site. No build step needed.
[build]
  publish = "learnable"
  command = ""

# Single-page app: any path that isn't a real file (old links, bookmarks,
# /dashboard, etc.) loads the app instead of Netlify's "Page not found".
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
